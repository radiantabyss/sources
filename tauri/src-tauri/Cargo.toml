[package]
name = "ra-tauri"
version = "1.0.0"
description = "ra-tauri"
authors = ["RadiantAbyss"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "protocol-asset"] }
tauri-plugin-ra = { git = "https://github.com/radiantabyss/tauri" }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

serde_json = "1"
log = "0.4"

# Working on the ra crate itself: build against the local checkout instead of git.
# [patch."https://github.com/radiantabyss/tauri"]
# tauri-plugin-ra = { path = "G:/www/ra/tauri" }

# Production: maximally optimized and stripped. Used by `npm run release`.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Dev: skip LTO and parallelise codegen. Used by `npm run build`.
# Binary is ~2x larger and slightly slower, but compiles in a fraction of the time.
[profile.dev-release]
inherits = "release"
codegen-units = 16
lto = false
opt-level = 1
strip = false
